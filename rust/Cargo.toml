[workspace]
resolver = "2"
members = [
    "crates/mgcore",
    "crates/mgslk",
    "crates/mgstorage",
    "crates/mgdurability",
    "crates/mgparser",
    "crates/mginterp",
    "crates/mgserver",
    "crates/mgbolt",
    "crates/mgrpc",
    "crates/mgrepl",
    "crates/mgdbms",
    "crates/mgcoord",
    "crates/mgprocedure",
    "crates/mgplanner",
    "crates/mgvector",
    "crates/mgkafka",
    "crates/mgdisk",
    "crates/mgcatalog",
    "crates/mgsemantic",
    "crates/mgquery",
    "crates/mgflags",
    "crates/mgauth",
    "crates/mgglue",
    "crates/mgcsv",
    "crates/mghttp",
    "crates/mgtelemetry",
    "crates/mgsystem",
    "crates/mgaudit",
    "crates/integration-tests",
    "benches",
]

# All planned crates have been created.
# Remaining work: full C API implementation, production hardening, C++ source removal.
#   "crates/mgparser",
#   "crates/mgsemantic",
#   "crates/mgplanner",
#   "crates/mginterp",
#   "crates/mgprocedure",
