[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSL-1.0"
repository = "https://github.com/memgraph/memgraph"
rust-version = "1.75"

[workspace.dependencies]
openraft = { version = "0.9", features = ["storage-v2", "serde"] }
egg = "0.6"
crossbeam-skiplist = "0.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio = { version = "1", features = ["full"] }
libloading = "0.8"
criterion = "0.5"
rocksdb = "0.22"
tantivy = "0.22"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
csv = "1.3"
bytes = "1"
http-body = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }
num_cpus = "1"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = "0.24"
futures = "0.3"

# Internal crate dependencies
mgcore = { path = "crates/mgcore" }
mgslk = { path = "crates/mgslk" }
mgstorage = { path = "crates/mgstorage" }
mgdurability = { path = "crates/mgdurability" }
mgparser = { path = "crates/mgparser" }
mginterp = { path = "crates/mginterp" }
mgserver = { path = "crates/mgserver" }
mgbolt = { path = "crates/mgbolt" }
mgrpc = { path = "crates/mgrpc" }
mgrepl = { path = "crates/mgrepl" }
mgdbms = { path = "crates/mgdbms" }
mgcoord = { path = "crates/mgcoord" }
mgprocedure = { path = "crates/mgprocedure" }
mgplanner = { path = "crates/mgplanner" }
mgvector = { path = "crates/mgvector" }
mgkafka = { path = "crates/mgkafka" }
mgdisk = { path = "crates/mgdisk" }
mgcatalog = { path = "crates/mgcatalog" }
mgsemantic = { path = "crates/mgsemantic" }
mgquery = { path = "crates/mgquery" }
mgflags = { path = "crates/mgflags" }
mgauth = { path = "crates/mgauth" }
mgglue = { path = "crates/mgglue" }
mgcsv = { path = "crates/mgcsv" }
mghttp = { path = "crates/mghttp" }
mgtelemetry = { path = "crates/mgtelemetry" }
mgsystem = { path = "crates/mgsystem" }
mgaudit = { path = "crates/mgaudit" }
