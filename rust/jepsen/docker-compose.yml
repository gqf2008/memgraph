version: '3.8'

services:
  memgraph:
    image: debian:12-slim
    command: >
      sh -c "apt-get update && apt-get install -y curl &&
             while true; do sleep 1; done"
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - ../../target/release/mgserver:/usr/local/bin/mgserver:ro
    networks:
      - jepsen

  n1:
    image: debian:12-slim
    command: >
      sh -c "apt-get update && apt-get install -y curl net-tools iproute2 &&
             /usr/local/bin/mgserver --bolt-address 0.0.0.0 --bolt-port 7687 ||
             while true; do sleep 1; done"
    ports:
      - "17687:7687"
    volumes:
      - ../../target/release/mgserver:/usr/local/bin/mgserver:ro
    networks:
      - jepsen

  n2:
    image: debian:12-slim
    command: >
      sh -c "apt-get update && apt-get install -y curl net-tools iproute2 &&
             /usr/local/bin/mgserver --bolt-address 0.0.0.0 --bolt-port 7687 ||
             while true; do sleep 1; done"
    ports:
      - "17688:7687"
    volumes:
      - ../../target/release/mgserver:/usr/local/bin/mgserver:ro
    networks:
      - jepsen

  n3:
    image: debian:12-slim
    command: >
      sh -c "apt-get update && apt-get install -y curl net-tools iproute2 &&
             /usr/local/bin/mgserver --bolt-address 0.0.0.0 --bolt-port 7687 ||
             while true; do sleep 1; done"
    ports:
      - "17689:7687"
    volumes:
      - ../../target/release/mgserver:/usr/local/bin/mgserver:ro
    networks:
      - jepsen

  n4:
    image: debian:12-slim
    command: >
      sh -c "apt-get update && apt-get install -y curl net-tools iproute2 &&
             /usr/local/bin/mgserver --bolt-address 0.0.0.0 --bolt-port 7687 ||
             while true; do sleep 1; done"
    ports:
      - "17690:7687"
    volumes:
      - ../../target/release/mgserver:/usr/local/bin/mgserver:ro
    networks:
      - jepsen

  n5:
    image: debian:12-slim
    command: >
      sh -c "apt-get update && apt-get install -y curl net-tools iproute2 &&
             /usr/local/bin/mgserver --bolt-address 0.0.0.0 --bolt-port 7687 ||
             while true; do sleep 1; done"
    ports:
      - "17691:7687"
    volumes:
      - ../../target/release/mgserver:/usr/local/bin/mgserver:ro
    networks:
      - jepsen

  control:
    image: clojure:temurin-17-lein
    command: >
      sh -c "apt-get update && apt-get install -y openssh-client &&
             while true; do sleep 1; done"
    volumes:
      - ../../tests/jepsen:/jepsen:ro
    working_dir: /jepsen
    networks:
      - jepsen

networks:
  jepsen:
    driver: bridge
