name: Rust

on:
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch or commit ref to run the workflow on'
        required: false
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo check --workspace
        working-directory: rust

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace -- --nocapture
        working-directory: rust
        timeout-minutes: 30

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --workspace -- -D warnings
        working-directory: rust

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
          components: rustfmt
      - run: cargo fmt -- --check
        working-directory: rust

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo bench --workspace
        working-directory: rust
        timeout-minutes: 30

  cross-lang-slk:
    name: Cross-language SLK compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 python3-pip g++

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0

      - name: Try to install Memgraph toolchain (optional)
        id: toolchain
        continue-on-error: true
        run: |
          # Toolchain download is best-effort; the cross-lang test does NOT need it.
          MG_TOOLCHAIN_ROOT="${MG_TOOLCHAIN_ROOT:-/opt/toolchain-v7}"
          if [ ! -d "$MG_TOOLCHAIN_ROOT" ]; then
            echo "Toolchain not present at $MG_TOOLCHAIN_ROOT, skipping."
            exit 0
          fi
          echo "Toolchain present at $MG_TOOLCHAIN_ROOT"

      - name: Build C++ SLK compatibility testers
        run: |
          g++ -std=c++17 -O2 -o cpp_slk_compat rust/tests/cpp_slk_compat.cpp
          g++ -std=c++17 -O2 -o cpp_property_value_writer rust/tests/cpp_property_value_writer.cpp

      - name: Run Rust cross-language SLK test
        working-directory: rust
        run: |
          # Pre-compile C++ helpers to save time and verify builds work.
          cp ../cpp_slk_compat tests/cpp_slk_compat
          cp ../cpp_property_value_writer tests/cpp_property_value_writer
          cargo test --test cpp_slk_compat -- --nocapture
